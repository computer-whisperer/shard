# The V3 gates, as an async checkmark per commit.
#
# WHAT IS GATED. V3, under v3/, and the Rust evaluator that runs it (rust_bootstrap/). No job
# reads tools/zed-shard/.
#
#   host        the Rust evaluator built and its unit tests run; the docs-only script's
#               self-test. Untagged: any runner.
#   v3          the suite on the bootstrap (the authority).
#   replay      the full replay of the pinned Lean `Init` export on compiled K against its
#               pinned verdict (v3/t0_full.sh).
#   native      every root of the inventory built by V3's own back end on the bootstrap
#               (v3/build.sh --all --bootstrap: kernel/lower.shard, kernel/cgen.shard, cc), each
#               root's C text tied to the loader binary's emit of it (v3/build.sh --tie), the
#               byte-tie gate, then the suite on the binaries.
#   suite_tie   the two suite runs compared entrypoint by entrypoint.
#
# NO HAND-OFF BETWEEN JOBS but the suite's kept outputs (v3 and native to suite_tie): each gate
# job builds the Rust evaluator itself, from its runner-local cargo cache when it has one.
#
# HOW MANY AT A TIME. `v3`, `replay` and `native` run side by side on the high-cpu runner, whose
# jobs are each held to 32 cores of the machine's 64 (the runner's `cpu_limit`; `nproc` prints
# 64). Inside a job the work is independent processes of one thread each, so the counts below
# are cores: 24 entrypoints of the suite at a time (V3_TEST_JOBS), 28 roots of the build
# (V3_BUILD_JOBS) and 28 compiles of their C text over all of them (V3_CC_JOBS, whose default
# is what `nproc` prints), 24 workloads of the byte-tie gate (V3_TIE_JOBS). A job's time is then its
# longest single process — in `v3` one load of the imp model under the bootstrap.
#
# DOCUMENTATION-ONLY PUSHES. A push that changed only `.md` files gates nothing:
# `v3`, `replay`, `native` and `suite_tie` ask bin/ci_docs_only.sh first and step aside — each
# ends green in seconds with "DOCUMENTATION-ONLY PUSH" in its log. Such a pipeline's green says
# nothing about the tree: cite the pipeline of the push that carried the code. The question
# is about the PUSH ($CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA), not the head commit, so code pushed
# together with its documents is gated. It is asked inside the jobs because `rules: changes` can
# say "some changed file matches" and cannot say "every changed file matches". Every doubt runs
# the gates (the script's header lists them; a script that is missing or broken is a doubt), and
# a full run on a documentation head is
#   glab ci run -b main
# The `host` job is not asked — it is seconds — and runs the script's self-test first, on the
# runner's own git.

stages:
  - host
  - gate
  - tie

# The line the gate jobs open with (DOCUMENTATION-ONLY PUSHES, above).
.docs_only: &docs_only |
  if bin/ci_docs_only.sh; then
    echo "DOCUMENTATION-ONLY PUSH: nothing to gate, this job steps aside (.gitlab-ci.yml, the header)"
    exit 0
  fi

# The Rust evaluator, trusted by review. Its unit tests are the evaluator's own — the
# primitives, the control forms, its reader.
host:
  stage: host
  image: docker.io/library/rust:latest
  timeout: 30m
  cache:
    key: shard-host
    paths:
      - rust_bootstrap/target/
  script:
    - bin/ci_docs_only.sh --self-test
    - echo "runner cores:" $(nproc) && (free -g || true)
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - cargo test --release --manifest-path rust_bootstrap/Cargo.toml

# V3's gate (v3/test.sh): the suite on the bootstrap — the authority —, its outputs kept for
# the suite_tie job. Nothing of the export is cached: the upload of a runner cache of its
# 3.5 GB, 18,569-file tree runs past 45 minutes, with the script long finished.
v3:
  stage: gate
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 3h
  interruptible: true
  needs:
    - host
  cache:
    - key: shard-host-gate
      paths:
        - rust_bootstrap/target/
        - v3/.cache/init.index
        - v3/.cache/init.index.stamp
  script:
    - *docs_only
    - echo "runner cores:" $(nproc) && (free -g || true)
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - v3/export.sh
    # the Init index: the cache's while the export and the index's two sources stand, else the
    # bootstrap builds it — the toolchain's own sources load by it, the index's driver included
    - v3/kernel/test/init_index.sh
    - V3_TEST_JOBS=24 V3_TEST_OUT=v3/bin/suite/bootstrap bash v3/test.sh
  artifacts:
    paths:
      - v3/bin/suite/
    when: always
    expire_in: 30 days

# The Init replay (v3/t0_full.sh): K compiled by V3's back end (v3/build.sh), unproven, so the
# run first byte-ties the binary's verbose per-declaration output against the bootstrap on a
# prefix, then replays the whole pinned Lean `Init` export and requires the pinned verdict
# line (v3/t0_expected.txt). One process for twenty minutes, so it has a job of its own beside
# the suite and waits for nothing. The replay holds a 30 GB peak resident set (the export
# tables hold every referenced node) — the high-cpu machine has the memory.
replay:
  stage: gate
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 3h
  interruptible: true
  needs:
    - host
  cache:
    - key: shard-host-gate
      paths:
        - rust_bootstrap/target/
        - v3/.cache/init.index
        - v3/.cache/init.index.stamp
  script:
    - *docs_only
    - echo "runner cores:" $(nproc) && (free -g || true)
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - v3/export.sh
    - v3/kernel/test/init_index.sh
    - V3_CC_JOBS=28 v3/build.sh
    - v3/t0_full.sh v3_t0_full.log
  artifacts:
    paths:
      - v3_t0_full.log
    when: always
    expire_in: 30 days

# The native toolchain: every root of the inventory built — the V3 loader's emit
# (load.shard --emit: kernel/lower.shard, kernel/cgen.shard) and cc into v3/bin/ —, every emit
# on the bootstrap here, so that no binary of a pipeline rests on another. An author's build
# (v3/build.sh --all) has the loader's binary emit the other roots; the emit tie (v3/build.sh
# --tie) is what that rests on: the loader's binary emits every root again and each text is
# the bootstrap's, byte for byte — seconds a root. Then the
# byte-tie gate (kernel/test/native_tie_test.sh): the suite's workloads under the bootstrap
# and the binaries, stdout, stderr, exit status and artifacts byte for byte; then the whole
# suite on the binaries (V3_ENGINE=native: the shim v3/bin/eval), its outputs kept for the
# suite_tie job below. Its own job beside `v3` so that the bootstrap suite (the authority)
# keeps its time. The byte-tie gate's workloads run side by side, each under both engines in
# turn.
native:
  stage: gate
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 3h
  interruptible: true
  needs:
    - host
  cache:
    - key: shard-host-gate
      paths:
        - rust_bootstrap/target/
        - v3/.cache/init.index
        - v3/.cache/init.index.stamp
  script:
    - *docs_only
    - echo "runner cores:" $(nproc) && (free -g || true)
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - v3/export.sh
    - v3/kernel/test/init_index.sh
    - V3_BUILD_JOBS=28 V3_CC_JOBS=28 v3/build.sh --all --bootstrap
    - V3_BUILD_JOBS=28 v3/build.sh --tie
    - V3_TIE_JOBS=24 v3/kernel/test/native_tie_test.sh
    - V3_TEST_JOBS=24 V3_ENGINE=native V3_TEST_OUT=v3/bin/suite/native bash v3/test.sh
  artifacts:
    paths:
      - v3/bin/*.build.log
      - v3/bin/*.stamp
      - v3/bin/suite/
    when: always
    expire_in: 30 days

# The suite's two runs compared: the v3 job's bootstrap run and the native job's run on the
# binaries, entrypoint by entrypoint — exit status and output byte for byte under
# suite_tie.sh's stated normalization (a count of seconds, a scratch name).
# Needs both jobs' kept outputs (v3/bin/suite/); seconds, not minutes.
suite_tie:
  stage: tie
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 20m
  interruptible: true
  needs:
    - v3
    - native
  script:
    - *docs_only
    - v3/kernel/test/suite_tie.sh v3/bin/suite/bootstrap v3/bin/suite/native
