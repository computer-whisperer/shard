# The corpus gate as an async checkmark per commit.
#
# The corpus (run_corpus.sh) is a FAIL-set diff tool: red targets are
# pinned reject fixtures, and the gate fails only when the FAIL-set
# drifts from fails-base.txt. CI runs the FULL corpus including the
# embedded lowering-driver leg (interactive cycles skip it locally via
# SKIP_LOWERING=1 after running the driver directly).
#
# THE PROJECTION IS `^(FAIL|TYPE!)`, NOT `^FAIL`. A decl-level type
# rejection prints `TYPE! NAME`, never `FAIL NAME`, so while the grep
# read only ^FAIL an entire class of rejection pin was INVISIBLE here:
# pins/lang/types_gate.shard (3 legs) and refine_try_rejects.shard (2)
# had no fails-base rows at all and gated NOTHING — reopen the holes
# they watch and this diff would not move. Both line shapes put the
# subject in field 2, so one awk serves both.
#
# AND IT COMPARES `target: claim` PAIRS, not bare claim names. Folding
# TYPE! in pushed six names onto more than one row (bad_premise, big,
# zero_is_one, __decls__, __module__, __totality__), and a name-only
# diff rests on MULTIPLICITY: a leg lost in one file and gained in
# another under the same name passes it. Tracking `=== target ===` and
# emitting the pair costs nothing and pins each leg to its home file.
# The awk below IS the baseline regenerator — `| sort > fails-base.txt`
# on a known-clean log rebuilds the whole thing mechanically, which is
# how the TYPE! back-fill was derived. Never hand-curate it.
#
# TWO JOBS, TWO RUNNERS. The engine build does not need the corpus
# machine: the `engine` job runs UNTAGGED (any runner) and builds BOTH
# fast engines (`bin/rebuild.sh check` — shard_eval, then shard_check
# compiled by it). The `corpus` job runs on the high-cpu machine.
#
# HAND-OFF IS ARTIFACTS, NOT CACHE: this GitLab has no shared cache
# server, so each runner's cache is LOCAL — a cache written by the
# engine runner is invisible to the corpus runner. The engine job
# publishes the four engine files as artifacts; `needs: [engine]`
# downloads them into the corpus job wherever it runs. Each job still
# keeps a local cache for its own run-to-run warm start (cargo target,
# engines for the fast-boot rebuild path). GitLab uploads neither cache
# nor artifacts on a TIMED-OUT job (measured, #44/#45) — the engine
# job's own generous timeout is what guarantees the artifacts land.
# The one-time cold bootstrap (Rust interpreter builds gen-1) is slow
# on a small runner; every later rebuild fast-boots from the cached
# previous engine and only runs when kernel sources actually changed
# (stamp check).

stages:
  - engine
  - gate

# The engine job is deliberately NOT interruptible: the one-time cold
# bootstrap (Rust interpreter compiles both engines; ~5-6h on the
# small runner) must run to completion ONCE to seed the runner-local
# cache -- auto-cancel on push was killing it mid-build every time
# (#54: 96m, #55: 108m), so the cache never landed. Warm runs are a
# stamp check (~minutes) and never block the pipeline long.
engine:
  stage: engine
  image: docker.io/library/rust:latest
  timeout: 8h
  resource_group: engine-build
  cache:
    key: shard-engine
    paths:
      - rust_bootstrap/target/
      - bin/shard_check
      - bin/shard_check.stamp
      - bin/shard_eval
      - bin/shard_eval.stamp
  script:
    - echo "runner cores:" $(nproc) && (free -g || true)
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - |
      if [ ! -x bin/shard_check ] || [ "$(bin/engine_stamp.sh)" != "$(cat bin/shard_check.stamp 2>/dev/null)" ]; then
        echo "engine stale or missing -- rebuilding (check mode: both engines)"
        bin/rebuild.sh check
      else
        echo "engine fresh (stamp match) -- rebuild skipped"
      fi
  artifacts:
    paths:
      - bin/shard_check
      - bin/shard_check.stamp
      - bin/shard_eval
      - bin/shard_eval.stamp
    expire_in: 7 days

corpus:
  stage: gate
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 6h
  interruptible: true
  rules:
    - if: $PIO_DEEP == "1"
      when: never
    - if: $SWAP_DEEP == "1"
      when: never
    - if: $ENGINE_RUN == "1"
      when: never
    - if: $CORPUS_LONG == "1"
      when: never
    - if: $CORPUS_IMAGES == "1"
      when: never
    - when: on_success
  needs:
    - engine
  cache:
    key: shard-engine
    policy: pull
    paths:
      - rust_bootstrap/target/
      - bin/shard_check
      - bin/shard_check.stamp
      - bin/shard_eval
      - bin/shard_eval.stamp
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs libcap2-bin > /dev/null
  script:
    - echo "runner cores:" $(nproc) && (free -g || true)
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - |
      if [ ! -x bin/shard_check ] || [ "$(bin/engine_stamp.sh)" != "$(cat bin/shard_check.stamp 2>/dev/null)" ]; then
        echo "engine stale or missing -- rebuilding (cache eviction fallback)"
        bin/rebuild.sh check
      fi
    - bash run_corpus.sh 2>&1 | tee corpus.log
    - |
      awk '/^=== /{t=$2} /^(FAIL|TYPE!) /{print t ": " $2}' corpus.log | sort > fails-run.txt
      sort fails-base.txt > fails-base-sorted.txt
      diff fails-run.txt fails-base-sorted.txt
    - echo "CORPUS == BASELINE"
  artifacts:
    paths:
      - corpus.log
    when: always
    expire_in: 30 days

# The LONG corpus: everything the default corpus runs PLUS the ~45-90 min
# block of search/PIO engine-run pins gated behind CORPUS_LONG=1 in
# run_corpus.sh.  Fire on occasion (after search-family merges, before
# baseline changes) with:  glab ci run -b main --variables CORPUS_LONG:1
# (the variable also steps the default corpus job aside).  Deliberately
# NOT interruptible: a later push must not auto-cancel a deliberate
# full sweep.
# NOTE no job-level `variables: CORPUS_LONG` here: job variables are
# visible to the job's OWN rules evaluation, so setting it would
# self-trigger this job in every pipeline (measured: #81). In a
# genuine CORPUS_LONG:1 pipeline the PIPELINE variable reaches the
# script's environment on its own.
corpus-long:
  extends: corpus
  interruptible: false
  rules:
    - if: $CORPUS_LONG == "1"
      when: on_success
    - when: never

# The S2b image-differential corpus (docs/STORAGE.md §8a): the whole
# corpus run TWICE with the loader's image front door on (SHARD_IMAGES=1
# -> every check consults/populates .shard-cache/images/) — pass 1 COLD
# (text parse + image write), pass 2 WARM (validated hits: decode, no
# parse). Both passes' FAIL projections must equal the committed text
# baseline — the "identical verdicts" half of the S2b gate ("identical
# loaded structures" is S2a's corpus roundtrip + the container's exact
# byte validation). Fire with:
#   glab ci run -b main --variables CORPUS_IMAGES:1
# (steps the default corpus aside, same pattern as corpus-long; same
# no-job-level-variable rule — see the corpus-long NOTE above).
corpus-images:
  extends: corpus
  interruptible: false
  rules:
    - if: $CORPUS_IMAGES == "1"
      when: on_success
    - when: never
  script:
    - echo "runner cores:" $(nproc) && (free -g || true)
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - |
      if [ ! -x bin/shard_check ] || [ "$(bin/engine_stamp.sh)" != "$(cat bin/shard_check.stamp 2>/dev/null)" ]; then
        echo "engine stale or missing -- rebuilding (cache eviction fallback)"
        bin/rebuild.sh check
      fi
    - SHARD_IMAGES=1 bash run_corpus.sh 2>&1 | tee corpus-img-cold.log
    - SHARD_IMAGES=1 bash run_corpus.sh 2>&1 | tee corpus-img-warm.log
    - |
      sort fails-base.txt > fails-base-sorted.txt
      awk '/^=== /{t=$2} /^(FAIL|TYPE!) /{print t ": " $2}' corpus-img-cold.log | sort > fails-img-cold.txt
      diff fails-img-cold.txt fails-base-sorted.txt
      awk '/^=== /{t=$2} /^(FAIL|TYPE!) /{print t ": " $2}' corpus-img-warm.log | sort > fails-img-warm.txt
      diff fails-img-warm.txt fails-base-sorted.txt
    - echo "IMAGE CORPUS == TEXT BASELINE (cold + warm)"
  artifacts:
    paths:
      - corpus-img-cold.log
      - corpus-img-warm.log
    when: always
    expire_in: 30 days

# The template-free DME first-result probe (docs/PIO.md P5c-2),
# variable-gated on any branch carrying the task (merged to main
# 2026-07-17).  Fire with:  glab ci run -b main --variables PIO_DEEP:1
# (PIO_DEEP=1 also SKIPS the corpus job -- the deep probe replaces the
# gate for that pipeline).
#
# The task's committed drive budget (50) is the fast smoke value; this
# job seds it to $PIO_BUDGET (default 38,000).  Measured shape (local
# A/B 2026-07-17): the ~11-12 MB/decision retention SATURATES at
# ~67.6 GB around 6k decisions — RSS is byte-flat from there on, and
# flat RSS is HEALTHY search, not a stall.  Per-decision cost grows
# with depth (~quadratic fit: 6,100 decisions = 18 min local; 38k
# projected ~10-12 h local, more on these cores).  Override the budget
# per-run to climb the validation ladder:
#   glab ci run -b BRANCH --variables PIO_DEEP:1 --variables PIO_BUDGET:12000
# Each on-time clean exit extends the validated frontier; a run far
# past its prediction has BRACKETED a stuck decision — attach and dump
# before killing.  Green = a winner region in the log; red = budget
# exhausted (informative — recalibrates the frontier, not a
# regression).  The watchdog cap stays at 490 GiB (512Gi pod tier);
# nothing measured yet needs the 1.5T high-mem slot.
#
# TIMEOUT: no runner has maximum_timeout set (checked 2026-07-18), so
# the job-level timeout is the only ceiling.  48h covers the 38k rung's
# ~32h projection (T_CI(n) ~ 1.32e-6 n^2 min, two-point fit) with slack
# for a worse-than-quadratic tail.  The margin is load-bearing: GitLab
# uploads NO artifacts on a timed-out job, and the engine reports only
# at exit — a timeout here means total loss of the run.
# Generic engine-run job for probe-style programs (drivers, demos) whose
# runtime is UNVALIDATED.  The standing rule: any new engine-run
# configuration — new task, instance, budget, or driver — fires HERE
# first (RSS watchdog + artifact capture); the dev box only runs
# configurations already measured fast.  Founding case: the PCB routing
# driver sat at the ~67.6GB retention plateau for six CPU-hours locally
# because refutation levels cost exponential-in-slack.  Fire with:
#   glab ci run -b BRANCH --variables ENGINE_RUN:1 \
#     --variables ENGINE_RUN_TARGET:tools/search/pcb_route_probe.shard
engine-run:
  stage: gate
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 8h
  variables:
    ENGINE_RUN_TARGET: "tools/search/pcb_route_probe.shard"
    # Internal deadline BELOW the job timeout: a pod killed at the job
    # timeout uploads NO artifacts (measured: pipeline 174 lost its log).
    # The watchdog loop kills the engine at this age, so the script ends
    # while artifacts can still upload.  Exit 124 = deadline hit.
    ENGINE_RUN_SECS: "25200"
  rules:
    - if: $ENGINE_RUN == "1"
      when: on_success
    - when: never
  cache:
    key: shard-engine
    paths:
      - rust_bootstrap/target/
      - bin/shard_check
      - bin/shard_check.stamp
      - bin/shard_eval
      - bin/shard_eval.stamp
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs > /dev/null
  script:
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - |
      if [ ! -x bin/shard_check ] || [ "$(bin/engine_stamp.sh)" != "$(cat bin/shard_check.stamp 2>/dev/null)" ]; then
        echo "engine stale or missing -- rebuilding"
        bin/rebuild.sh
      else
        echo "engine fresh (stamp match) -- rebuild skipped"
      fi
    - 'echo "target: ${ENGINE_RUN_TARGET}"'
    - |
      bin/shard_eval run "$ENGINE_RUN_TARGET" > engine_run.log 2>&1 &
      ENG=$!
      CAP_KB=$((490 * 1024 * 1024))
      PEAK=0; TICK=0; DEADLINE=0
      while kill -0 "$ENG" 2>/dev/null; do
        RSS=$(awk '/VmRSS/{print $2}' /proc/$ENG/status 2>/dev/null)
        [ "${RSS:-0}" -gt "$PEAK" ] && PEAK=$RSS
        if [ "${RSS:-0}" -gt "$CAP_KB" ]; then
          echo "WATCHDOG: RSS ${RSS} kB over ${CAP_KB} kB cap -- killing engine"
          kill -9 "$ENG"
          break
        fi
        if [ $((TICK * 30)) -ge "$ENGINE_RUN_SECS" ]; then
          echo "WATCHDOG: internal deadline ${ENGINE_RUN_SECS}s hit -- killing engine"
          DEADLINE=1
          kill -9 "$ENG"
          break
        fi
        TICK=$((TICK + 1))
        if [ $((TICK % 10)) -eq 0 ]; then
          echo "watchdog: RSS ${RSS:-0} kB (peak ${PEAK} kB)  log: $(tail -n 1 engine_run.log 2>/dev/null)"
        fi
        sleep 30
      done
      wait "$ENG"; STATUS=$?
      [ "$DEADLINE" -eq 1 ] && STATUS=124
      echo "ENGINE EXIT ${STATUS}  PEAK RSS ${PEAK} kB  (124 = internal deadline)"
      cat engine_run.log
      exit "$STATUS"
  artifacts:
    paths:
      - engine_run.log
    when: always
    expire_in: 30 days

# The swap-network split-economics ladder (R5 follow-on): the k=4 routing
# task (swap_route5, depth 11, four-letter alphabet) under three arms —
#   theorem-first WITH relational splits   (more-search HEAD)
#   theorem-first with GROUND forks only   (branch swap-ground = HEAD with
#                                           the skl_iso extension reverted)
#   semantic-first                         (SWAP_SCHED:semantic_first —
#                                           structurally split-free)
# Fire per arm:
#   glab ci run -b more-search --variables SWAP_DEEP:1 --variables SWAP_BUDGET:N
#   glab ci run -b more-search --variables SWAP_DEEP:1 --variables SWAP_BUDGET:N \
#     --variables SWAP_SCHED:semantic_first
#   glab ci run -b swap-ground --variables SWAP_DEEP:1 --variables SWAP_BUDGET:N
# Local calibration (2026-07-28, dev box): budget 500 = 3m54s wall,
# prepass-dominated (9,586 terminal regions, splits 10 before the loop's
# 500 decisions).  Climb SWAP_BUDGET rungs; the 24h timeout is a ceiling,
# not a target — a timed-out job uploads NO artifacts (PIO lesson).
swap-route-deep:
  stage: gate
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 24h
  variables:
    SWAP_TASK: "tools/search/tasks/swap_route5.shard"
    SWAP_BUDGET: "5000"
    SWAP_SCHED: "theorem_first"
  rules:
    - if: $SWAP_DEEP == "1"
      when: on_success
    - when: never
  cache:
    key: shard-engine
    paths:
      - rust_bootstrap/target/
      - bin/shard_check
      - bin/shard_check.stamp
      - bin/shard_eval
      - bin/shard_eval.stamp
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs > /dev/null
  script:
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - |
      if [ ! -x bin/shard_check ] || [ "$(bin/engine_stamp.sh)" != "$(cat bin/shard_check.stamp 2>/dev/null)" ]; then
        echo "engine stale or missing -- rebuilding"
        bin/rebuild.sh
      else
        echo "engine fresh (stamp match) -- rebuild skipped"
      fi
    - |
      if [ "$SWAP_SCHED" = "semantic_first" ]; then
        sed -i "/(fn search_narrowing_strategy () Symbol (quote theorem_first))/d" "$SWAP_TASK"
        echo "schedule: semantic_first (hook removed)"
      else
        echo "schedule: theorem_first (committed hook)"
      fi
    - sed -i "s/(fn search_drive_budget () Int [0-9]*)/(fn search_drive_budget () Int ${SWAP_BUDGET})/" "$SWAP_TASK"
    - grep -F "(fn search_drive_budget () Int ${SWAP_BUDGET})" "$SWAP_TASK"
    - |
      bin/shard_eval run tools/search/typed_superpose.shard "$SWAP_TASK" > swap_route_deep.log 2>&1 &
      ENG=$!
      CAP_KB=$((490 * 1024 * 1024))
      PEAK=0; TICK=0
      while kill -0 "$ENG" 2>/dev/null; do
        RSS=$(awk '/VmRSS/{print $2}' /proc/$ENG/status 2>/dev/null)
        [ "${RSS:-0}" -gt "$PEAK" ] && PEAK=$RSS
        if [ "${RSS:-0}" -gt "$CAP_KB" ]; then
          echo "WATCHDOG: RSS ${RSS} kB over ${CAP_KB} kB cap -- killing engine"
          kill -9 "$ENG"
          break
        fi
        TICK=$((TICK + 1))
        if [ $((TICK % 10)) -eq 0 ]; then echo "watchdog: RSS ${RSS:-0} kB (peak ${PEAK} kB)"; fi
        sleep 30
      done
      wait "$ENG"; STATUS=$?
      echo "ENGINE EXIT ${STATUS}  PEAK RSS ${PEAK} kB"
      cat swap_route_deep.log
      exit "$STATUS"
  artifacts:
    paths:
      - swap_route_deep.log
    when: always
    expire_in: 30 days

pio-dme-free:
  stage: gate
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 48h
  variables:
    PIO_BUDGET: "38000"
  rules:
