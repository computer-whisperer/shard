# The V3 gates, as an async checkmark per commit.
#
# WHAT IS GATED. V3, under v3/, and the Rust evaluator that runs it (rust_bootstrap/). The
# old tree's kernel was deleted at slice 5.0 (v3/LANGUAGE.md §8.7; the tag v2-kernel-last holds
# it) and its jobs with it — `engine` as the builder of the old checker's binaries, `corpus`,
# `corpus-long`, `corpus-closed`, `corpus-images`, `engine-run`, `swap-route-deep`,
# `pio-dme-free`. What is left of the old tree (std/, meta/, models/, tools/, examples/, pins/)
# is unchecked text until each family migrates: no job reads it.
#
#   host        the Rust evaluator built and its unit tests run; the docs-only script's
#               self-test. Untagged: any runner.
#   v3          the suite on the bootstrap (the authority), then the full replay of the pinned
#               Lean `Init` export on compiled K against its pinned verdict (v3/t0_full.sh).
#   native      every root of the inventory built by V3's own back end (v3/build.sh --all:
#               kernel/lower.shard, kernel/cgen.shard, cc), the byte-tie gate, then the suite on
#               the binaries.
#   suite_tie   the two suite runs compared entrypoint by entrypoint.
#
# NO HAND-OFF BETWEEN JOBS but the suite's kept outputs (v3 and native to suite_tie): each gate
# job builds the Rust evaluator itself, from its runner-local cargo cache when it has one.
#
# DOCUMENTATION-ONLY PUSHES (2026-11-11). A push that changed only `.md` files gates nothing:
# `v3`, `native` and `suite_tie` ask bin/ci_docs_only.sh first and step aside — each ends green
# in seconds with "DOCUMENTATION-ONLY PUSH" in its log. Such a pipeline's green says nothing
# about the tree: a record cites the pipeline of the push that carried the code. The question
# is about the PUSH ($CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA), not the head commit, so code pushed
# together with its record is gated. It is asked inside the jobs because `rules: changes` can
# say "some changed file matches" and cannot say "every changed file matches". Every doubt runs
# the gates (the script's header lists them; a script that is missing or broken is a doubt), and
# a full run on a documentation head is
#   glab ci run -b main
# The `host` job is not asked — it is seconds — and runs the script's self-test first, on the
# runner's own git.

stages:
  - host
  - gate
  - tie

# The line the gate jobs open with (DOCUMENTATION-ONLY PUSHES, above).
.docs_only: &docs_only |
  if bin/ci_docs_only.sh; then
    echo "DOCUMENTATION-ONLY PUSH: nothing to gate, this job steps aside (.gitlab-ci.yml, the header)"
    exit 0
  fi

# The Rust evaluator: E's executor, trusted by review (FOUNDATION §9.1). Its unit tests are
# the evaluator's own — the primitives, the control forms, the loader's reading of E.
host:
  stage: host
  image: docker.io/library/rust:latest
  timeout: 30m
  cache:
    key: shard-host
    paths:
      - rust_bootstrap/target/
  script:
    - bin/ci_docs_only.sh --self-test
    - echo "runner cores:" $(nproc) && (free -g || true)
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - cargo test --release --manifest-path rust_bootstrap/Cargo.toml

# V3's gate (v3/README.md, v3/t0_full.sh, v3/test.sh; FOUNDATION §12.4, §12.5). The suite on
# the bootstrap first — the authority —, its outputs kept for the suite_tie job; then T0: K
# compiled by V3's back end (v3/build.sh), still unproven, so the run first byte-ties the
# binary's verbose per-declaration output against the interpreter on a prefix, then replays the
# whole pinned Lean `Init` export and requires the pinned verdict line (v3/t0_expected.txt).
# A runner cache of the export's 3.5 GB, 18,569-file tree was tried on the first pass
# (2026-09-07) and its upload ran past 45 minutes with the script long finished, so nothing of
# it is cached. The replay holds a 30 GB peak resident set (the export tables hold every
# referenced node) — the high-cpu machine has the memory. v3/release/ is the store
# store_test.sh writes for calc (LANGUAGE.md §8.4 slice 3.22 rule 7): the release bundle K
# alone replays, published as the artifact, never committed.
v3:
  stage: gate
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 3h
  interruptible: true
  needs:
    - host
  cache:
    - key: shard-host-gate
      paths:
        - rust_bootstrap/target/
  script:
    - *docs_only
    - echo "runner cores:" $(nproc) && (free -g || true)
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - v3/export.sh
    - v3/build.sh v3/kernel/initindex.shard v3/bin/initindex
    - v3/kernel/test/init_index.sh
    - V3_TEST_OUT=v3/bin/suite/bootstrap bash v3/test.sh
    - v3/build.sh
    - v3/t0_full.sh v3_t0_full.log
  artifacts:
    paths:
      - v3_t0_full.log
      - v3/release/
      - v3/bin/suite/
    when: always
    expire_in: 30 days

# The native toolchain (v3/LANGUAGE.md §8.6 slice 4.1, §8.7 slice 5.0): route 1 over every
# root of the inventory — the V3 loader's emit (load.shard --emit: kernel/lower.shard,
# kernel/cgen.shard) and cc into v3/bin/ — and the byte-tie gate
# (kernel/test/native_tie_test.sh): the suite's workloads under the bootstrap and the binaries,
# stdout, stderr, exit status and artifacts byte for byte; then the whole suite on the binaries
# (V3_ENGINE=native: the shim v3/bin/eval, rule 4), its outputs kept for the suite_tie job
# below. Its own job beside `v3` so that the bootstrap suite (the authority) keeps its time.
native:
  stage: gate
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 3h
  interruptible: true
  needs:
    - host
  cache:
    - key: shard-host-gate
      paths:
        - rust_bootstrap/target/
  script:
    - *docs_only
    - echo "runner cores:" $(nproc) && (free -g || true)
    - cargo build --release --manifest-path rust_bootstrap/Cargo.toml
    - v3/export.sh
    - V3_BUILD_JOBS=16 v3/build.sh --all
    - v3/kernel/test/init_index.sh
    - v3/kernel/test/native_tie_test.sh
    - V3_ENGINE=native V3_TEST_OUT=v3/bin/suite/native bash v3/test.sh
  artifacts:
    paths:
      - v3/bin/*.build.log
      - v3/bin/*.stamp
      - v3/bin/suite/
    when: always
    expire_in: 30 days

# The suite's two runs compared (v3/LANGUAGE.md §8.6 slice 4.1 rule 4): the v3 job's bootstrap
# run and the native job's run on the binaries, entrypoint by entrypoint — exit status and
# output byte for byte under suite_tie.sh's stated normalization (a count of seconds, a store's
# size, a scratch name). Needs both jobs' kept outputs (v3/bin/suite/); seconds, not minutes.
suite_tie:
  stage: tie
  tags:
    - high-cpu
  image: docker.io/library/rust:latest
  timeout: 20m
  interruptible: true
  needs:
    - v3
    - native
  script:
    - *docs_only
    - v3/kernel/test/suite_tie.sh v3/bin/suite/bootstrap v3/bin/suite/native
