id = "shard"
name = "Shard"
description = "Editing support for the shard language (*.shard): syntax highlighting for the object language, the proof DSL, and the module/artifact forms; outline navigation; indentation and bracket handling. See docs/LANGUAGE.md."
version = "0.2.0"
schema_version = 1
authors = ["computer-whisperer"]
repository = "https://github.com/computer-whisperer/shard"

# The on-disk form is plain s-expressions, so the Scheme tree-sitter
# grammar parses every .shard file cleanly (verified against the whole
# corpus with the tree-sitter CLI). All shard-specific knowledge lives
# in languages/shard/*.scm, keyed on list-head symbols.
#
# To pin a vendored grammar instead, point `path = "./grammars/scheme"`
# and drop the repository/commit pair.
[grammars.scheme]
repository = "https://github.com/6cdh/tree-sitter-scheme"
# Same commit pinned by zed-extensions/scheme (the official extension).
commit = "af0fd1fa452cb2562dc7b5c8a8c55551c39273b9"
